<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist di Sandro</title>
    <script src="https://kit.fontawesome.com/03eb2181c5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <main>
        <header>
            <div class="titolo">
                <h1><span><i class="fa-brands fa-itunes-note"></i></span>Playlist di Sandro</h1>
            </div>
            <button id="theme-button" class="theme-button" type="button"><i class="fa-solid fa-moon"></i></button>
        </header>


        <div class="search-box">
            <input aria-label="Cerca per titolo o artista" id="search-input" placeholder="Cerca per titolo o artista..."
                type="text">
            <button id="addButton" class="main-button" type="button"><i class="fa-solid fa-plus"></i>Aggiungi</button>
            <p class="hint">Per aggiungere un brano scrivi: Artista - Titolo, scegli il genere e premi Aggiungi</p>
        </div>
        <div class="option-menu">
            <button id="favoritesButton" class="main-button"><i class="fa-regular fa-star"></i>Preferiti</button>
            <select aria-label="Genere" name="generi" id="generi">
                <option value="tutti i generi">Tutti i generi</option>
                <option value="Progressive Metal">Progressive Metal</option>
                <option value="Metal">Metal</option>
                <option value="Rock">Rock</option>

            </select>
        </div>

        <div class="titles-container" id="titles-container"></div>

    </main>

    <script src="assets/js/script.js"></script>
</body>

</html>
